tools:
  sql_tool:
    description: "Аналитический вопрос требующий SQL-запроса к БД"
    examples:
      - "сколько пользователей за май 2022"
      - "топ задач по числу решений"
      - "динамика регистраций по месяцам"

  text_answer_tool:
    description: "Вопрос про термины и метрики — отвечаем без SQL"
    examples:
      - "что такое MAU?"
      - "как считается retention?"
      - "что такое CodeCoins?"

  clarification_tool:
    description: "Вопрос размытый или данных за период нет"
    examples:
      - "покажи статистику"
      - "данные за 2030 год"

  reject_tool:
    description: "Вопрос не относится к аналитике платформы"
    examples:
      - "привет"
      - "напиши стихотворение"

db_date_range:
  date_from: "2021-01-01"
  date_to: "2022-12-31"
  description: "Данные в БД только за этот период"